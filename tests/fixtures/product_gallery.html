<!doctype html>
<html lang="en">
  <head>
    <title>Orbit One | Example Audio</title>
    <link rel="canonical" href="https://gallery.example/products/orbit-one">
    <meta property="og:image" content="https://cdn.gallery.example/open-graph.jpg">
    <meta property="og:image:alt" content="Example Audio Orbit One">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="800">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "url": "https://gallery.example/products/orbit-one",
        "name": "Example Audio Orbit One",
        "brand": "Example Audio",
        "category": "Portable Speakers",
        "image": "https://cdn.gallery.example/structured-primary.jpg"
      }
    </script>
  </head>
  <body>
    <nav class="site-navigation">
      <img src="https://cdn.gallery.example/navigation-logo.png" alt="Example Audio">
    </nav>
    <main>
      <section class="product-detail commerce-overview">
        <div class="visual-stage" aria-label="Product media">
          <img
            src="https://cdn.gallery.example/product-bound.jpg"
            width="1000"
            height="750"
            alt="Orbit One front view">
          <picture>
            <source
              srcset="https://cdn.gallery.example/picture-small.webp 480w, https://cdn.gallery.example/picture-large.webp 1800w">
            <img src="https://cdn.gallery.example/picture-fallback.jpg" alt="Orbit One side view">
          </picture>
          <img
            src="data:image/gif;base64,placeholder"
            data-src="https://cdn.gallery.example/lazy-loaded.jpg"
            alt="Orbit One rear view">
          <img
            src="https://cdn.gallery.example/responsive-fallback.jpg"
            srcset="https://cdn.gallery.example/responsive-small.jpg 320w, https://cdn.gallery.example/responsive-large.jpg 1600w"
            alt="Orbit One controls">
          <img
            data-src="https://cdn.gallery.example/malformed-fallback.jpg"
            srcset="https://cdn.gallery.example/broken-one.jpg 1x, broken-entry"
            alt="Orbit One package">
          <img
            src="https://cdn.gallery.example/structured-primary.jpg"
            alt="Orbit One duplicate primary">
        </div>
        <div class="product-information">
          <h1>Example Audio Orbit One</h1>
        </div>
        <div class="promotion-banner product-media">
          <img src="https://cdn.gallery.example/promotion.jpg" alt="Seasonal promotion">
        </div>
        <div class="trust-badges product-media">
          <img src="https://cdn.gallery.example/payment-badge.png" alt="Secure payment">
        </div>
        <div class="variant-swatches product-media">
          <img src="https://cdn.gallery.example/sibling-variant.jpg" alt="Other color">
        </div>
      </section>
      <section class="editorial-images">
        <img src="https://cdn.gallery.example/outside-product-region.jpg" alt="Editorial image">
      </section>
      <section class="customer-reviews product-media">
        <img src="https://cdn.gallery.example/customer-upload.jpg" alt="Customer upload">
      </section>
      <section class="related-products product-media">
        <img src="https://cdn.gallery.example/related-product.jpg" alt="Related product">
      </section>
    </main>
    <footer class="site-footer product-media">
      <img src="https://cdn.gallery.example/footer-social.png" alt="Social media">
    </footer>
  </body>
</html>
